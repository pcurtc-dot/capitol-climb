<style>

body.calm *{animation:none!important;transition:none!important}

button{font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:20px;min-height:64px;padding:.5em 1.1em;background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-d);touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-d)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e0d6c2;border:3px solid #eee3cf}
button.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #c88c1c}
button.big{font-size:1.25em;min-height:76px;width:100%}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{max-width:1000px;margin:0 auto;padding:12px}
.screen{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 #eadfca;padding:20px}
.center{text-align:center}.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:.15em .8em;border-radius:99px;background:var(--teal-l);color:var(--teal-d);font-weight:800;font-size:.8em}
.title-wrap{position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(#bfeee9,#fff3d6);min-height:80vh;display:flex;flex-direction:column;align-items:center;padding:22px 12px 0}
.title-wrap h1{font-size:clamp(2.4rem,8vw,4.4rem);text-shadow:0 4px 0 #fff;text-align:center;margin:0}
.title-wrap h2{color:var(--teal-d);text-align:center;font-size:clamp(1.1rem,3.5vw,1.6rem)}
.title-btns{display:flex;flex-direction:column;gap:14px;width:min(360px,92%);z-index:2;margin:10px 0}
.skyline{width:100%;height:auto;margin-top:auto;display:block}
.note{text-align:center;font-size:.8em;color:var(--muted);margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lvl{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--teal-d);font-size:1.1em}
.ladder{display:flex;gap:6px;font-size:1.2em}
.hearts{font-size:1.5em;letter-spacing:2px;white-space:nowrap}
.say{background:#fff;border:0;box-shadow:0 4px 0 #e0d6c2;min-height:56px;min-width:56px;padding:.2em .6em;color:var(--ink);font-size:1em}
.lines{font-size:1.3em;list-style:none;padding:0;margin:14px 0}
.lines li{background:var(--teal-l);border-radius:18px;padding:12px 16px;margin:10px 0}
.hoot{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:10px 14px;margin-top:12px}
.hoot svg{flex:0 0 70px}
.mapwrap{position:relative;border-radius:22px;overflow:hidden}
.mapwrap svg{pointer-events:none;display:block;width:100%;height:auto}
.pinbtn{z-index:3;position:absolute;transform:translate(-50%,-50%);min-height:64px;font-size:1em;padding:.3em .8em;border-radius:22px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pinbtn:active{transform:translate(-50%,-46%)}.pinbtn.done{background:#b9b4a7;box-shadow:0 5px 0 #8f8a7d}
.pinbtn .e{font-size:1.5em}
.pinbtn.pulse .e{display:inline-block;animation:bob 1.4s infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.12)}}
@media(max-width:640px){.pinbtn{font-size:.8em;min-height:58px;padding:.2em .55em}.pinbtn .lab{display:none}.pinbtn .e{font-size:1.8em}}
.legend{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.legend button{text-align:left}
.dlg{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media(max-width:600px){.dlg{grid-template-columns:90px 1fr}}
.portrait{width:100%;border-radius:22px}
.bubble{background:#fff;border-radius:22px;padding:16px 18px;position:relative;box-shadow:0 4px 0 #eadfca;font-size:1.25em}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media(max-width:700px){.choices{grid-template-columns:1fr}}
.choice{background:#fff;color:var(--ink);border:3px solid #eee3cf;box-shadow:0 6px 0 #e0d6c2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;font-size:1.1em}
@media(max-width:700px){.choice{flex-direction:row;min-height:84px;justify-content:flex-start;text-align:left}}
.choice .e{font-size:2.6em;line-height:1}
.tapzone{position:relative;height:340px;background:#eaf6ee;border-radius:24px;overflow:hidden;margin-top:10px}
.tapzone button{position:absolute;width:84px;height:84px;font-size:2.6em;border-radius:50%;padding:0;background:#fff;box-shadow:0 5px 0 #d8ceb9}
.elect{background:linear-gradient(#2b2d42,#41437a);color:#fff;border-radius:30px;padding:22px;min-height:78vh;text-align:center}
.elect h1{color:#fff}
.bigbar{display:flex;height:58px;border-radius:29px;overflow:hidden;background:#555a7a;font-weight:900;margin:20px 0;position:relative}
.bigbar div{display:flex;align-items:center;padding:0 16px;white-space:nowrap;overflow:hidden;transition:width .25s}
.box{font-size:3.2em;display:inline-block;animation:drop .7s infinite}
@keyframes drop{0%{transform:translateY(-18px)}60%{transform:none}}
.fcard{background:#fff;border-radius:20px;padding:16px;border-top:8px solid var(--gold);box-shadow:0 5px 0 #eadfca;text-align:left;color:var(--ink);font-size:1.1em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.locked{opacity:.4;filter:grayscale(1)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;max-height:46vh;overflow:auto;padding:4px}
.sgrid button{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e0d6c2;min-height:64px;padding:0}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.regions button{min-height:110px;font-size:1.15em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.regions button.done{background:#b9b4a7;box-shadow:0 5px 0 #8f8a7d}
.regions .e{font-size:1.9em}
.track{position:relative;height:48px;background:#efe8da;border-radius:24px;overflow:hidden;display:flex}
.track .me{background:var(--teal);transition:width .5s}.track .them{background:repeating-linear-gradient(45deg,#7b5cd6 0 8px,#9c84e6 8px 14px);margin-left:auto;transition:width .5s}
.track .mark{position:absolute;left:50.2%;top:0;bottom:0;width:4px;background:var(--ink)}
.track b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);text-shadow:0 0 4px #fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:18px;z-index:120;font-weight:800;max-width:92vw}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;width:12px;height:16px;top:-20px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.stars{font-size:2em;letter-spacing:4px}
#musicbtn{position:fixed;top:10px;right:10px;z-index:200;min-height:56px;min-width:56px;padding:.3em .7em;border-radius:50px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #e0d6c2;border:3px solid var(--gold);font-size:1.15em}
#musicbtn.off{border-color:#ccc;opacity:.85}
</style>
</head>

 const TRACKS=["e/ed/Sousa%27s_%22The_Stars_and_Stripes_Forever%22_-_United_States_Marine_Band_%282017%29.mp3","8/8d/Sousa%27s_%22The_Washington_Post%22_-_United_States_Marine_Band_%282017%29.mp3","9/9d/Sousa%27s_%22Semper_Fidelis%22_-_United_States_Marine_Band_%282016%29.mp3","1/12/Sousa%27s_%22The_Liberty_Bell%22_-_United_States_Marine_Band_%282017%29.mp3","3/36/America_the_Beautiful_-_Starlifter_-_United_States_Air_Force_Band_of_Mid-America.mp3","9/9f/Yankee_Doodle_-_Concert_Band_-_United_States_Air_Force_Heritage_of_America_Band.mp3"].map(t=>B+t);
 const a=document.getElementById("bgm"),btn=document.getElementById("musicbtn");if(!a||!btn)return;
 let on=true,started=false,idx=0,fails=0;try{on=localStorage.getItem("capclimb_music")!=="off"}catch(e){}
 a.volume=0.4;
 function paint(){btn.textContent=on?"🎵":"🔇";btn.classList.toggle("off",!on);btn.setAttribute("aria-pressed",String(on))}
 function load(i){idx=(i+TRACKS.length)%TRACKS.length;a.src=TRACKS[idx];a.volume=0.4}
 function play(){if(!on)return;if(!a.src)load(idx);const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}
 a.addEventListener("ended",()=>{fails=0;load(idx+1);play()});
 a.addEventListener("playing",()=>{fails=0});
 a.addEventListener("error",()=>{if(++fails<TRACKS.length&&navigator.onLine!==false){load(idx+1);play()}});
 btn.addEventListener("click",e=>{e.stopPropagation();on=!on;try{localStorage.setItem("capclimb_music",on?"on":"off")}catch(err){}paint();started=true;if(on)play();else a.pause()});
 document.addEventListener("click",()=>{if(!started){started=true;play()}},true);
 window.addEventListener("online",()=>{if(on&&started&&a.paused){fails=0;play()}});
 window.CCMusic={get on(){return on},get playing(){return !a.paused},get track(){return a.src},TRACKS};
 paint();
})();
title();
</script>
</body>
